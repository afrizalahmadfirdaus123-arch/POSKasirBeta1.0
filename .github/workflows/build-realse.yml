name: Build Release (signed)

# Dijalankan manual: tab Actions > "Build Release (signed)" > Run workflow
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nama versi yang tampil ke pengguna (contoh: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Kode versi (angka, harus naik tiap rilis ke Play Store). Kosongkan = otomatis dari nomor run.'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Pastikan secrets sudah diisi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          missing=0
          for v in KEYSTORE_B64 KS_PASS KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Secret untuk $v belum diisi"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install
      - run: npm run build

      - name: Buat project Android jika belum ada
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Atur versi aplikasi
        run: |
          CODE="${{ github.event.inputs.version_code }}"
          if [ -z "$CODE" ]; then CODE="${{ github.run_number }}"; fi
          NAME="${{ github.event.inputs.version_name }}"
          echo "versionCode=$CODE versionName=$NAME"
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$NAME\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build rilis (belum ditandatangani)
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease

      - name: Siapkan keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tandatangani AAB (untuk Play Store)
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/afzpos-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KS_FILE" -storepass:env KS_PASS -keypass:env KEY_PASS \
            out/afzpos-release.aab "$KEY_ALIAS"
          jarsigner -verify out/afzpos-release.aab | tail -n 2

      - name: Tandatangani APK (untuk dibagikan langsung)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$KS_FILE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out out/afzpos-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify out/afzpos-release.apk && echo "APK valid"

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: afzpos-release
          path: |
            out/afzpos-release.aab
            out/afzpos-release.apk
